<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🛒 장보기</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0f172a; -webkit-tap-highlight-color: transparent; }
  .check { transition: all .15s ease; }
  input[type="checkbox"] { accent-color: #22c55e; }
</style>
</head>
<body class="text-slate-100 min-h-screen">

<!-- 비밀번호 게이트 (가계부와 동일한 비밀번호) -->
<div id="lock" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center px-6">
  <div class="w-full max-w-xs text-center">
    <p class="text-4xl mb-3">🛒</p>
    <h2 class="text-lg font-bold mb-1">장보기</h2>
    <p class="text-xs text-slate-400 mb-4">비밀번호를 입력하세요</p>
    <input id="pw" type="password" inputmode="text" autocomplete="off"
      class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg tracking-widest focus:outline-none focus:border-sky-500"
      placeholder="••••••••">
    <button id="pw-btn"
      class="w-full mt-3 bg-sky-600 hover:bg-sky-500 rounded-xl py-3 font-bold">열기</button>
    <p id="pw-err" class="text-xs text-red-400 mt-2 h-4"></p>
  </div>
</div>

<div id="app" class="max-w-md mx-auto px-4 pb-10 pt-6" style="display:none">

  <header class="mb-5">
    <div class="flex items-baseline justify-between">
      <h1 class="text-2xl font-extrabold">🛒 장보기</h1>
      <a href="./" class="text-xs text-sky-300 font-bold">🏠 가계부로</a>
    </div>
    <p class="text-xs text-slate-400 mt-1">마트에서 담으면서 체크하세요. 기록은 이 기기에만 저장됩니다.</p>
  </header>

  <!-- 요약 카드 -->
  <div class="grid grid-cols-3 gap-2 mb-5">
    <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700">
      <p class="text-[11px] text-slate-400">담은 금액</p>
      <p id="sum-checked" class="text-lg font-extrabold text-emerald-400">-</p>
      <p id="sum-count" class="text-[10px] text-slate-500"></p>
    </div>
    <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700">
      <p class="text-[11px] text-slate-400">전체 예정</p>
      <p id="sum-total" class="text-lg font-extrabold text-slate-200">-</p>
      <p id="sum-cal" class="text-[10px] text-slate-500"></p>
    </div>
    <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700">
      <p class="text-[11px] text-slate-400">남은 항목</p>
      <p id="sum-left" class="text-lg font-extrabold text-amber-300">-</p>
      <p class="text-[10px] text-slate-500">담을 것</p>
    </div>
  </div>

  <!-- 추가 폼 -->
  <section class="mb-5">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-3.5">
      <div class="flex gap-1.5 mb-2">
        <input id="f-name" placeholder="품목명 (예: 우유)" class="flex-1 min-w-0 bg-slate-900 rounded-lg px-3 py-2 text-sm text-slate-100">
        <input id="f-qty" type="number" min="1" value="1" class="w-16 bg-slate-900 rounded-lg px-2 py-2 text-sm text-center text-slate-100" title="수량">
      </div>
      <div class="flex gap-1.5 mb-2">
        <input id="f-price" type="number" step="0.01" min="0" placeholder="가격 ($)" class="flex-1 min-w-0 bg-slate-900 rounded-lg px-3 py-2 text-sm text-slate-100">
        <input id="f-cal" type="number" min="0" placeholder="칼로리 (kcal)" class="flex-1 min-w-0 bg-slate-900 rounded-lg px-3 py-2 text-sm text-slate-100">
      </div>
      <div class="flex gap-1.5">
        <input id="f-exp" type="date" class="flex-1 min-w-0 bg-slate-900 rounded-lg px-3 py-2 text-sm text-slate-100" title="유통기한">
        <button id="f-add" class="shrink-0 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg px-5 py-2">추가</button>
      </div>
    </div>
  </section>

  <!-- 장보기 리스트 -->
  <section class="mb-6">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">🧺 살 것</h2>
      <span id="list-count" class="text-xs text-slate-400"></span>
    </div>
    <ul id="g-list" class="space-y-2"></ul>
    <div class="flex gap-2 mt-3">
      <button id="btn-done" class="flex-1 text-sm font-bold text-emerald-300 bg-emerald-900/50 rounded-xl py-2.5">✅ 장보기 완료 (담은 것 기록)</button>
      <button id="btn-clear" class="text-sm font-bold text-red-300 bg-red-900/40 rounded-xl px-4 py-2.5">전체 삭제</button>
    </div>
  </section>

  <!-- 장보기 기록 -->
  <section>
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">📜 장보기 기록</h2>
      <span id="hist-count" class="text-xs text-slate-400"></span>
    </div>
    <ul id="g-hist" class="space-y-2"></ul>
  </section>

  <footer class="mt-8 text-center text-[11px] text-slate-500">
    기록은 이 기기의 브라우저에만 저장됩니다
  </footer>
</div>

<script>
const fmt = n => '$' + n.toLocaleString('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const LS_ITEMS = 'grocery_items_v1', LS_HIST = 'grocery_history_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const todayNoon = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate(), 12); };

// 첫 실행 시 코스트코 리스트로 시드
const SEED = [
  {name:'토마토', qty:10}, {name:'HONEY ROASTED NUT MIX', qty:15},
  {name:'김', qty:10, price:14.49}, {name:'물티슈', qty:20},
  {name:'큰 토마토', qty:10, price:6.99}, {name:'양파', qty:10, price:7.99},
  {name:'치킨 스트립', qty:10}, {name:'생리대', qty:20, price:17.49},
  {name:'자두', price:13.99}, {name:'바나나', price:1.99},
  {name:'오이', price:2.99}, {name:'계란', qty:2, price:6.09},
  {name:'아이스크림', price:10.99}, {name:'너트', price:18.99},
];
function getItems() {
  try {
    const raw = localStorage.getItem(LS_ITEMS);
    if (raw == null) {
      const seeded = SEED.map(s => ({id: uid(), checked: false, cal: null, exp: null, ...s}));
      localStorage.setItem(LS_ITEMS, JSON.stringify(seeded));
      return seeded;
    }
    return JSON.parse(raw);
  } catch (e) { return []; }
}
function setItems(a) { localStorage.setItem(LS_ITEMS, JSON.stringify(a)); }
function getHist() { try { return JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch (e) { return []; } }
function setHist(a) { localStorage.setItem(LS_HIST, JSON.stringify(a)); }
const lineTotal = it => (it.price || 0) * (it.qty || 1);

function expBadge(exp) {
  if (!exp) return '';
  const days = Math.round((parseYMD(exp) - todayNoon()) / 86400000);
  if (days < 0) return '<span class="text-[10px] font-bold text-red-300 bg-red-900/60 rounded px-1.5 py-0.5 ml-1">유통기한 지남</span>';
  if (days <= 3) return `<span class="text-[10px] font-bold text-amber-300 bg-amber-900/60 rounded px-1.5 py-0.5 ml-1">D-${days}</span>`;
  return `<span class="text-[10px] text-slate-400 bg-slate-700 rounded px-1.5 py-0.5 ml-1">D-${days}</span>`;
}
function render() {
  const items = getItems();
  const open = items.filter(i => !i.checked), done = items.filter(i => i.checked);
  const checkedTotal = done.reduce((s, i) => s + lineTotal(i), 0);
  const grandTotal = items.reduce((s, i) => s + lineTotal(i), 0);
  const checkedCal = done.reduce((s, i) => s + (i.cal || 0) * (i.qty || 1), 0);

  document.getElementById('sum-checked').textContent = done.length ? fmt(checkedTotal) : '-';
  document.getElementById('sum-count').textContent = done.length ? done.length + '개 담음' : '';
  document.getElementById('sum-total').textContent = items.length ? fmt(grandTotal) : '-';
  document.getElementById('sum-cal').textContent = checkedCal ? checkedCal.toLocaleString() + ' kcal 담음' : '';
  document.getElementById('sum-left').textContent = open.length ? open.length + '개' : '0개';
  document.getElementById('list-count').textContent = items.length + '개 항목';

  const row = it => {
    const lt = lineTotal(it);
    const sub = [
      it.qty > 1 ? '×' + it.qty : '',
      it.price ? fmt(it.price) + (it.qty > 1 ? ' ×' + it.qty + ' = ' + fmt(lt) : '') : '',
      it.cal ? it.cal.toLocaleString() + ' kcal' + (it.qty > 1 ? ' ×' + it.qty : '') : '',
    ].filter(Boolean).join(' · ');
    return `
    <li data-id="${it.id}" class="check flex items-center gap-3 bg-slate-800 rounded-2xl border border-slate-700 px-3.5 py-3 cursor-pointer ${it.checked ? 'opacity-50' : ''}">
      <input type="checkbox" ${it.checked ? 'checked' : ''} class="w-6 h-6 shrink-0 pointer-events-none">
      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold truncate ${it.checked ? 'line-through text-slate-500' : ''}">${it.name}${it.qty > 1 ? ' <span class="text-[11px] text-slate-400">×' + it.qty + '</span>' : ''}${expBadge(it.exp)}</p>
        ${sub ? `<p class="text-[11px] text-slate-400">${sub}</p>` : ''}
        ${it.exp ? `<p class="text-[10px] text-slate-500">유통기한 ${it.exp}</p>` : ''}
      </div>
      <span class="text-sm font-bold ${it.checked ? 'text-slate-500' : 'text-slate-100'} whitespace-nowrap">${it.price ? fmt(lt) : '-'}</span>
      <button data-del="${it.id}" class="shrink-0 text-slate-600 hover:text-red-400 text-lg leading-none px-1">×</button>
    </li>`;
  };
  document.getElementById('g-list').innerHTML =
    open.map(row).join('') + done.map(row).join('') ||
    '<li class="text-sm text-slate-500 text-center py-6">리스트가 비어 있어요. 위에서 추가하세요.</li>';

  document.querySelectorAll('#g-list li[data-id]').forEach(li => {
    li.addEventListener('click', e => {
      if (e.target.dataset.del) return;
      const a = getItems();
      const it = a.find(x => x.id === li.dataset.id);
      if (it) { it.checked = !it.checked; setItems(a); render(); }
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      setItems(getItems().filter(x => x.id !== btn.dataset.del));
      render();
    });
  });

  // 기록
  const hist = getHist();
  document.getElementById('hist-count').textContent = hist.length + '회';
  document.getElementById('g-hist').innerHTML = hist.length ? hist.map(h => `
    <li class="bg-slate-800 rounded-2xl border border-slate-700 px-4 py-3">
      <div class="flex items-baseline justify-between mb-1">
        <p class="text-sm font-bold">${h.date}</p>
        <p class="text-sm font-extrabold text-emerald-300">${fmt(h.total)}</p>
      </div>
      <p class="text-[11px] text-slate-400">${h.count}개 품목${h.cal ? ' · ' + h.cal.toLocaleString() + ' kcal' : ''}</p>
      <p class="text-[11px] text-slate-500 truncate mt-0.5">${h.items}</p>
    </li>`).join('')
    : '<li class="text-sm text-slate-500 text-center py-4">아직 기록이 없어요</li>';
}

document.getElementById('f-add').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const price = parseFloat(document.getElementById('f-price').value);
  const qty = parseInt(document.getElementById('f-qty').value) || 1;
  const cal = parseInt(document.getElementById('f-cal').value) || null;
  const exp = document.getElementById('f-exp').value || null;
  const a = getItems();
  a.unshift({id: uid(), name, qty: Math.max(1, qty), price: isNaN(price) ? null : price, cal, exp, checked: false});
  setItems(a);
  document.getElementById('f-name').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-cal').value = '';
  document.getElementById('f-exp').value = '';
  document.getElementById('f-qty').value = '1';
  document.getElementById('f-name').focus();
  render();
});
document.getElementById('f-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('f-add').click(); });

document.getElementById('btn-done').addEventListener('click', () => {
  const a = getItems();
  const done = a.filter(i => i.checked);
  if (!done.length) { alert('담은(체크한) 항목이 없어요'); return; }
  const total = done.reduce((s, i) => s + lineTotal(i), 0);
  const cal = done.reduce((s, i) => s + (i.cal || 0) * (i.qty || 1), 0);
  const t = new Date();
  const date = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  const h = getHist();
  h.unshift({date, count: done.length, total: Math.round(total * 100) / 100, cal: cal || null,
    items: done.map(i => i.name + (i.qty > 1 ? '×' + i.qty : '')).join(', ')});
  setHist(h);
  setItems(a.filter(i => !i.checked));
  render();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!getItems().length) return;
  if (confirm('리스트를 전부 지울까요? (기록에는 남지 않습니다)')) { setItems([]); render(); }
});

// --- 비밀번호 게이트 (가계부와 동일한 비밀번호) ---
const PW_HASH = '1eea1bc249e5cc50f45a1f73c66056448fc6a0e1a850de297bb9f4cd23b5f15e';
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function unlock() {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display = '';
  sessionStorage.setItem('household_auth', '1');
  render();
}
async function tryUnlock() {
  const v = document.getElementById('pw').value;
  if (!v) return;
  const h = await sha256(v);
  if (h === PW_HASH) { unlock(); }
  else {
    document.getElementById('pw-err').textContent = '비밀번호가 틀렸어요';
    document.getElementById('pw').value = '';
  }
}
document.getElementById('pw-btn').addEventListener('click', tryUnlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
if (sessionStorage.getItem('household_auth') === '1') { unlock(); }
else { document.getElementById('pw').focus(); }
</script>
</body>
</html>
